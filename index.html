<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroHUD Live</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-space: #070a10;
      --bg-panel: rgba(13, 19, 32, 0.95);
      --bg-card: #0d1422;
      --border-hud: rgba(0, 240, 255, 0.25);
      --border-hud-bright: rgba(0, 240, 255, 0.7);
      
      --cyan-neon: #00f0ff;
      --amber-neon: #ffaa00;
      --green-radar: #00ff88;
      --red-alert: #ff3366;
      --text-main: #d8e5f7;
      --text-muted: #72849e;
      
      --font-hud: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 75%),
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      font-family: var(--font-hud);
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    /* Avionics Header */
    header.hud-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hud);
      padding: 0.65rem 1rem;
    }

    .hud-top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .radar-sweep-icon {
      width: 20px; height: 20px;
      border: 2px solid var(--cyan-neon);
      border-radius: 50%;
      position: relative;
    }
    .radar-sweep-icon::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; width: 50%; height: 2px;
      background: var(--cyan-neon);
      transform-origin: 0 0;
      animation: sweep 2s linear infinite;
    }
    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    .brand-title .byline {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--amber-neon);
      text-transform: none;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    .hud-status-strip {
      display: flex; align-items: center; gap: 0.8rem;
      font-family: var(--font-mono); font-size: 0.72rem;
    }
    .stat-item { display: flex; align-items: center; gap: 0.35rem; }
    .stat-label { color: var(--text-muted); }
    .stat-value { color: var(--cyan-neon); font-weight: 700; }

    .heartbeat-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green-radar); box-shadow: 0 0 8px var(--green-radar);
      transition: transform 0.2s;
    }
    .heartbeat-dot.pulsing { transform: scale(1.6); background: #fff; }

    /* Controls ribbon */
    .controls-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem;
      margin-top: 0.5rem; padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-family: var(--font-mono); font-size: 0.78rem;
    }
    .control-group { display: flex; align-items: center; gap: 0.35rem; }

    input[type="number"], select {
      background: rgba(4, 7, 12, 0.9); border: 1px solid var(--border-hud);
      color: #fff; padding: 0.25rem 0.45rem; font-family: var(--font-mono);
      font-size: 16px; border-radius: 3px;
    }
    @media (min-width: 768px) { input[type="number"], select { font-size: 0.78rem; } }

    input[type="range"] { accent-color: var(--cyan-neon); cursor: pointer; width: 80px; }

    .btn {
      background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border-hud);
      color: var(--cyan-neon); padding: 0.35rem 0.65rem; font-family: var(--font-hud);
      text-transform: uppercase; font-size: 0.72rem; font-weight: 600;
      border-radius: 3px; cursor: pointer;
    }
    .btn:active { background: var(--cyan-neon); color: #000; }

    /* Tactical Map Display */
    #mapContainer {
      width: 100%;
      height: 290px;
      position: relative;
      border-bottom: 1px solid var(--border-hud);
      background: #080d1a;
    }
    @media (min-width: 900px) {
      #mapContainer { height: 380px; }
    }
    #map { width: 100%; height: 100%; background: #070b14; }

    /* Plane Marker SVG */
    .plane-marker-wrapper {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .plane-svg {
      width: 24px;
      height: 24px;
      fill: var(--cyan-neon);
      filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.8));
      transition: fill 0.2s, filter 0.2s;
    }

    /* Highlighted Yellow Marker */
    .plane-marker-wrapper.highlighted .plane-svg {
      fill: var(--amber-neon) !important;
      filter: drop-shadow(0 0 10px rgba(255, 170, 0, 1)) !important;
      transform: scale(1.25);
    }

    /* User pulse */
    .user-pos-pulse {
      width: 14px; height: 14px; background: var(--cyan-neon);
      border-radius: 50%; box-shadow: 0 0 10px var(--cyan-neon);
      animation: pulseUser 2s infinite ease-out;
    }
    @keyframes pulseUser {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Map Tactical Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(13, 20, 34, 0.95) !important;
      border: 1px solid var(--cyan-neon) !important;
      border-radius: 4px !important;
      color: #fff !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8) !important;
      font-family: var(--font-hud) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0.65rem 0.8rem !important;
      line-height: 1.3 !important;
    }
    .leaflet-popup-tip {
      background: rgba(13, 20, 34, 0.95) !important;
      border: 1px solid var(--cyan-neon) !important;
    }
    .hud-popup-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.25rem;
      margin-bottom: 0.35rem;
    }
    .hud-popup-body {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .hud-popup-body strong { color: var(--cyan-neon); }
    .hud-popup-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      font-family: var(--font-hud);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.3rem 0;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
    }
    .hud-popup-btn:active {
      background: var(--cyan-neon);
      color: #000;
    }

    /* Cards Layout */
    main { max-width: 1440px; margin: 1rem auto; padding: 0 0.8rem; }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .aircraft-card {
      background: var(--bg-card);
      border: 1px solid var(--border-hud);
      border-radius: 4px; overflow: hidden;
      display: flex; flex-direction: column;
      position: relative; transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      cursor: pointer;
    }
    .aircraft-card:hover {
      border-color: var(--cyan-neon);
    }
    .aircraft-card.highlighted {
      border-color: var(--amber-neon) !important;
      box-shadow: 0 0 16px rgba(255, 170, 0, 0.4) !important;
      transform: translateY(-2px);
    }

    .card-photo-wrapper {
      position: relative; height: 130px; background: #03060c;
      display: flex; align-items: center; justify-content: center;
    }
    .card-photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .silhouette-fallback {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #0e172a 0%, #060911 100%);
    }
    .silhouette-fallback svg { width: 44px; height: 44px; fill: var(--border-hud); }

    .photo-attribution {
      position: absolute; bottom: 3px; right: 5px; font-size: 0.55rem;
      font-family: var(--font-mono); background: rgba(0, 0, 0, 0.75);
      padding: 1px 4px; border-radius: 2px; color: #aaa;
    }

    .card-main { padding: 0.85rem; display: flex; flex-direction: column; gap: 0.6rem; flex: 1; }
    
    .flight-identity {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 0.35rem;
    }
    .callsign { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .icao-hex {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber-neon);
      background: rgba(255, 170, 0, 0.12); padding: 0.1rem 0.35rem; border-radius: 2px;
    }

    /* Enhanced Route Card Ribbon */
    .route-row {
      background: rgba(0, 240, 255, 0.04);
      border: 1px solid rgba(0, 240, 255, 0.12);
      padding: 0.45rem 0.6rem;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .route-airports {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .airport-box {
      display: flex;
      flex-direction: column;
    }
    .airport-box.dest { text-align: right; }
    .airport-code {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .airport-name {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--cyan-neon);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-arrow {
      color: var(--cyan-neon);
      font-size: 1rem;
      opacity: 0.8;
    }

    .flight-duration-bar {
      display: flex;
      justify-content: space-between;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      padding-top: 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .flight-duration-bar span strong {
      color: var(--amber-neon);
    }

    .aircraft-type-desc {
      font-size: 0.76rem; color: var(--text-muted); font-family: var(--font-mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .telemetry-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem 0.75rem; background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.04); padding: 0.5rem;
      border-radius: 4px; font-family: var(--font-mono);
    }
    .telemetry-item { display: flex; flex-direction: column; }
    .tele-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
    .tele-value { font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.3rem; }

    .vrate-climb { color: var(--green-radar); }
    .vrate-descend { color: var(--red-alert); }
    .vrate-level { color: var(--text-muted); }

    .empty-hud {
      grid-column: 1 / -1; text-align: center; padding: 3rem 1rem;
      border: 1px dashed var(--border-hud); border-radius: 4px; color: var(--text-muted);
    }
    .empty-hud h2 { color: #fff; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .empty-hud p { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="hud-header">
    <div class="hud-top-bar">
      <div class="brand">
        <div class="radar-sweep-icon"></div>
        <div class="brand-title">
          <h1>AeroHUD Live</h1>
          <span class="byline">by Tom</span>
        </div>
      </div>

      <div class="hud-status-strip">
        <div class="stat-item">
          <span class="stat-label">Feed:</span>
          <div id="heartbeatDot" class="heartbeat-dot"></div>
        </div>
        <div class="stat-item">
          <span class="stat-label">Planes:</span>
          <span id="statCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">POS:</span>
          <span id="statCoords" class="stat-value">--°, --°</span>
        </div>
      </div>
    </div>

    <div class="controls-strip">
      <div class="control-group">
        <label for="latInput">LAT:</label>
        <input type="number" id="latInput" step="0.001" style="width: 78px;" value="52.922">
        <label for="lonInput">LON:</label>
        <input type="number" id="lonInput" step="0.001" style="width: 78px;" value="-1.477">
        <button id="btnGps" class="btn">GPS</button>
      </div>

      <div class="control-group">
        <label for="radiusRange">Rad: <span id="radiusVal">60</span> NM</label>
        <input type="range" id="radiusRange" min="20" max="250" step="10" value="60">
      </div>

      <div class="control-group">
        <label for="sortSelect">Sort:</label>
        <select id="sortSelect">
          <option value="distance">Proximity (Closest)</option>
          <option value="altitude_asc">Altitude (Low)</option>
          <option value="altitude_desc">Altitude (High)</option>
          <option value="speed">Speed</option>
        </select>
      </div>

      <div class="control-group">
        <button id="btnScanNow" class="btn">Scan Now</button>
      </div>
    </div>
  </header>

  <!-- Clean Dark Map -->
  <div id="mapContainer">
    <div id="map"></div>
  </div>

      sortSelect: document.getElementById('sortSelect'),
      btnScanNow: document.getElementById('btnScanNow'),
      statCount: document.getElementById('statCount'),
      statCoords: document.getElementById('statCoords'),
      heartbeatDot: document.getElementById('heartbeatDot'),
      grid: document.getElementById('aircraftGrid')
    };

    const SILHOUETTE_SVG = `
      <div class="silhouette-fallback">
        <svg viewBox="0 0 24 24">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
    `;

    // Initialize Map with Watermark-Free OpenStreetMap Dark Filter Tiles
    function initMap() {
      state.map = L.map('map', {
        center: [state.userLat, state.userLon],
        zoom: 8,
        zoomControl: false,
        attributionControl: false
      });

      // Completely open, free Dark-Styled OpenStreetMap tiles (No API key, No watermarks)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png', {
        maxZoom: 18,
        subdomains: 'abcd'
      }).addTo(state.map);

      // Add subtle dark road/city label overlay
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_only_labels/{z}/{x}/{y}.png', {
        maxZoom: 18,
        subdomains: 'abcd',
        opacity: 0.65
      }).addTo(state.map);

      updateMapCenter();
    }

    function updateMapCenter() {
      if (!state.map) return;
      state.map.setView([state.userLat, state.userLon], state.map.getZoom());

      if (state.userMarker) state.userMarker.remove();
      const userIcon = L.divIcon({
        className: 'user-pos-pulse',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      state.userMarker = L.marker([state.userLat, state.userLon], { icon: userIcon }).addTo(state.map);

      if (state.coverageCircle) state.coverageCircle.remove();
      const radiusMeters = state.radiusNm * 1852;
      state.coverageCircle = L.circle([state.userLat, state.userLon], {
        radius: radiusMeters,
        color: '#00f0ff',
        weight: 1,
        dashArray: '4, 6',
        fillColor: '#00f0ff',
        fillOpacity: 0.03
      }).addTo(state.map);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function calculateBearingAndDistance(lat1, lon1, lat2, lon2) {
      const distance = calculateDistance(lat1, lon1, lat2, lon2);
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      let θ = Math.atan2(y, x) * 180 / Math.PI;
      const bearing = (θ + 360) % 360;

      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const compass = directions[Math.round(bearing / 22.5) % 16];

      return { distance, bearing: Math.round(bearing), compass };
    }

    // Lookup airport metadata
    function getAirportMeta(code) {
      if (!code) return { name: 'Unknown Airport', lat: null, lon: null };
      const upper = code.trim().toUpperCase();
      if (AIRPORTS[upper]) {
        return AIRPORTS[upper];
      }
      return { name: upper + ' Airport', lat: null, lon: null };
    }

    // Estimate flight duration & remaining time
    function estimateFlightTimes(ac) {
      const now = Date.now();
      if (!state.flightFirstSeen.has(ac.hex)) {
        state.flightFirstSeen.set(ac.hex, now);
      }
      const firstSeen = state.flightFirstSeen.get(ac.hex);

      let elapsedText = null;
      let remainingText = null;

      // Check if we have coordinate data for origin & destination
      const originMeta = getAirportMeta(ac.origin);
      const destMeta = getAirportMeta(ac.dest);

      if (originMeta.lat && destMeta.lat && ac.gs > 80) {
        // Distance from current position to destination
        const distToDest = calculateDistance(ac.lat, ac.lon, destMeta.lat, destMeta.lon);
        const hoursRemaining = distToDest / ac.gs;
        const totalMinRemaining = Math.round(hoursRemaining * 60);

        if (totalMinRemaining > 0) {
          const remHours = Math.floor(totalMinRemaining / 60);
          const remMins = totalMinRemaining % 60;
          remainingText = remHours > 0 ? `${remHours}h ${remMins}m` : `${remMins}m`;
        } else {
          remainingText = 'Arriving';
        }

        // Distance from origin to current position
        const distFromOrigin = calculateDistance(originMeta.lat, originMeta.lon, ac.lat, ac.lon);
        const hoursElapsed = distFromOrigin / ac.gs;
        const totalMinElapsed = Math.round(hoursElapsed * 60);
        if (totalMinElapsed > 0) {
          const elHours = Math.floor(totalMinElapsed / 60);
          const elMins = totalMinElapsed % 60;
          elapsedText = elHours > 0 ? `${elHours}h ${elMins}m` : `${elMins}m`;
        }
      }

      // Fallback to local session tracking if origin/dest GPS is unknown
      if (!elapsedText) {
        const trackedMinutes = Math.floor((now - firstSeen) / 60000);
        elapsedText = trackedMinutes > 1 ? `${trackedMinutes}m (in radar)` : 'Just entered sector';
      }

      return { elapsedText, remainingText };
    }

    function syncInputs() {
      elements.latInput.value = state.userLat.toFixed(3);
      elements.lonInput.value = state.userLon.toFixed(3);
      elements.statCoords.textContent = `${state.userLat.toFixed(2)}°, ${state.userLon.toFixed(2)}°`;
      updateMapCenter();
    }

    function tryGps() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.userLat = pos.coords.latitude;
            state.userLon = pos.coords.longitude;
            syncInputs();
            fetchFeed();
          },
          () => {
            syncInputs();
            fetchFeed();
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        syncInputs();
        fetchFeed();
      }
    }

    async function fetchPhoto(hex) {
      if (state.photoCache.has(hex)) return state.photoCache.get(hex);
      try {
        const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
        if (res.ok) {
          const data = await res.json();
          if (data.photos && data.photos.length > 0) {
            const p = data.photos[0];
            const info = {
              thumbnail: p.thumbnail_large?.src || p.thumbnail?.src,
              photographer: p.photographer
            };
            state.photoCache.set(hex, info);
            return info;
          }
        }
      } catch (e) {}
      state.photoCache.set(hex, null);
      return null;
    }

    async function fetchFeed() {
      elements.heartbeatDot.classList.add('pulsing');
      setTimeout(() => elements.heartbeatDot.classList.remove('pulsing'), 300);

      const lat = state.userLat.toFixed(4);
      const lon = state.userLon.toFixed(4);
      const rad = state.radiusNm;

      try {
        const res = await fetch(`${WORKER_URL}?lat=${lat}&lon=${lon}&rad=${rad}`);
        if (!res.ok) return;
        const data = await res.json();
        const list = data.ac || [];
        processAircraft(list);
      } catch (err) {}
    }

    function processAircraft(list) {
      state.aircraftMap.clear();

      list.forEach(ac => {
        const hex = (ac.hex || '').trim().toLowerCase();
        if (!hex || ac.lat === undefined || ac.lon === undefined) return;

        const rel = calculateBearingAndDistance(state.userLat, state.userLon, ac.lat, ac.lon);
        if (rel.distance > state.radiusNm) return;

        const times = estimateFlightTimes(ac);

        state.aircraftMap.set(hex, {
          hex,
          flight: ac.flight || 'NO CALLSIGN',
          type: ac.t || 'Commercial / GA',
          alt_baro: ac.alt_baro || 0,
          gs: ac.gs || 0,
          track: ac.track || 0,
          baro_rate: ac.baro_rate || 0,
          origin: ac.origin,
          dest: ac.dest,
          originName: getAirportMeta(ac.origin).name,
          destName: getAirportMeta(ac.dest).name,
          elapsedText: times.elapsedText,
          remainingText: times.remainingText,
          lat: ac.lat,
          lon: ac.lon,
          distance: rel.distance,
          bearing: rel.bearing,
          compass: rel.compass
        });

        if (!state.photoCache.has(hex)) {
          fetchPhoto(hex).then(photo => {
            if (photo) updateCardPhoto(hex, photo);
          });
        }
      });

      render();
      syncMapMarkers();
    }

    // Sync Leaflet map markers with two-way highlight logic
    function syncMapMarkers() {
      if (!state.map) return;

      const activeHexes = new Set();

      state.aircraftMap.forEach(ac => {
        activeHexes.add(ac.hex);
        const isSelected = state.activeHex === ac.hex;

        let marker = state.planeMarkers.get(ac.hex);
        const iconHtml = `
          <div class="plane-marker-wrapper ${isSelected ? 'highlighted' : ''}" id="marker-${ac.hex}">
            <svg class="plane-svg" style="transform: rotate(${ac.track}deg);" viewBox="0 0 24 24">
              <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
          </div>
        `;

        const divIcon = L.divIcon({
          className: '',
          html: iconHtml,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const popupContent = `
          <div class="hud-popup-title">
            <span>${ac.flight}</span>
            <span style="color:var(--amber-neon);">${ac.hex.toUpperCase()}</span>
          </div>
          <div class="hud-popup-body">
            <div>Route: <strong>${ac.origin || '---'} ➔ ${ac.dest || '---'}</strong></div>
            <div>Model: ${ac.type}</div>
            <div>Altitude: <strong>${ac.alt_baro.toLocaleString()} ft</strong></div>
            <div>Speed: <strong>${ac.gs} kts</strong> • Distance: <strong>${ac.distance.toFixed(1)} NM</strong></div>
          </div>
          <button class="hud-popup-btn" onclick="selectPlane('${ac.hex}', true)">VIEW TELEMETRY CARD ↓</button>
        `;

        if (marker) {
          marker.setLatLng([ac.lat, ac.lon]);
          marker.setIcon(divIcon);
          marker.setPopupContent(popupContent);
        } else {
          marker = L.marker([ac.lat, ac.lon], { icon: divIcon }).addTo(state.map);
          marker.bindPopup(popupContent, { offset: [0, -10] });
          marker.on('click', () => {
            selectPlane(ac.hex, false);
          });
          state.planeMarkers.set(ac.hex, marker);
        }
      });

      // Cleanup departed planes
      state.planeMarkers.forEach((marker, hex) => {
        if (!activeHexes.has(hex)) {
          marker.remove();
          state.planeMarkers.delete(hex);
        }
      });
    }

    // Two-way Selection Handler: Highlights Marker (Yellow) and Card
    window.selectPlane = function(hex, scrollToCard = true) {
      state.activeHex = hex;

      // Update Map Marker classes
      document.querySelectorAll('.plane-marker-wrapper').forEach(el => el.classList.remove('highlighted'));
      const activeEl = document.getElementById(`marker-${hex}`);
      if (activeEl) activeEl.classList.add('highlighted');

      // Update Card classes
      document.querySelectorAll('.aircraft-card').forEach(c => c.classList.remove('highlighted'));
      const card = document.getElementById(`ac-${hex}`);
      if (card) {
        card.classList.add('highlighted');
        if (scrollToCard) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Pan map smoothly to plane
      const ac = state.aircraftMap.get(hex);
      if (ac && state.map) {
        state.map.panTo([ac.lat, ac.lon], { animate: true, duration: 0.5 });
      }
    };

    function render() {
      elements.statCount.textContent = state.aircraftMap.size;
      const list = Array.from(state.aircraftMap.values());

      list.sort((a, b) => {
        if (state.sortBy === 'distance') return a.distance - b.distance;
        if (state.sortBy === 'altitude_asc') return a.alt_baro - b.alt_baro;
        if (state.sortBy === 'altitude_desc') return b.alt_baro - a.alt_baro;
        if (state.sortBy === 'speed') return b.gs - a.gs;
        return 0;
      });

      if (list.length === 0) {
        elements.grid.innerHTML = `
          <div class="empty-hud">
            <h2>NO AIRCRAFT IN SECTOR</h2>
            <p>Scanning ${state.radiusNm} NM around ${state.userLat.toFixed(2)}°, ${state.userLon.toFixed(2)}°.</p>
          </div>
        `;
        return;
      }

      elements.grid.innerHTML = '';
      list.forEach(ac => {
        const card = document.createElement('div');
        card.className = `aircraft-card ${state.activeHex === ac.hex ? 'highlighted' : ''}`;
        card.id = `ac-${ac.hex}`;

        card.addEventListener('click', () => {
          selectPlane(ac.hex, false);
          // Open map popup for selected plane
          const marker = state.planeMarkers.get(ac.hex);
          if (marker) marker.openPopup();
        });

        const photo = state.photoCache.get(ac.hex);
        const photoHtml = photo 
          ? `<img src="${photo.thumbnail}" alt="${ac.hex}"><div class="photo-attribution">© ${photo.photographer}</div>`
          : SILHOUETTE_SVG;

        const vrateHtml = ac.baro_rate > 64 
          ? `<span class="vrate-climb">▲ +${ac.baro_rate} fpm</span>` 
          : (ac.baro_rate < -64 ? `<span class="vrate-descend">▼ ${ac.baro_rate} fpm</span>` : `<span class="vrate-level">LEVEL</span>`);

        const routeHtml = (ac.origin || ac.dest) ? `
          <div class="route-row">
            <div class="route-airports">
              <div class="airport-box">
                <span class="airport-code">${ac.origin || '---'}</span>
                <span class="airport-name">${ac.originName}</span>
              </div>
              <span class="route-arrow">✈</span>
              <div class="airport-box dest">
                <span class="airport-code">${ac.dest || '---'}</span>
                <span class="airport-name">${ac.destName}</span>
              </div>
            </div>
            <div class="flight-duration-bar">
              <span>Flight: <strong>${ac.elapsedText}</strong></span>
              <span>Remaining: <strong>${ac.remainingText || 'Live En-Route'}</strong></span>
            </div>
          </div>
        ` : `
          <div class="route-row">
            <div style="color:var(--text-muted); font-size:0.75rem;">LOCAL / CIRCUIT PATTERN TRAFFIC</div>
            <div class="flight-duration-bar">
              <span>Time in Sector: <strong>${ac.elapsedText}</strong></span>
            </div>
          </div>
        `;

        card.innerHTML = `
          <div class="card-photo-wrapper" id="photo-${ac.hex}">${photoHtml}</div>
          <div class="card-main">
            <div class="flight-identity">
              <span class="callsign">${ac.flight}</span>
              <span class="icao-hex">${ac.hex.toUpperCase()}</span>
            </div>
            ${routeHtml}
            <div class="aircraft-type-desc">${ac.type}</div>
            <div class="telemetry-grid">
              <div class="telemetry-item">
                <span class="tele-label">Distance & Pos</span>
                <span class="tele-value">${ac.distance.toFixed(1)} NM • ${ac.compass}</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Altitude</span>
                <span class="tele-value">${ac.alt_baro.toLocaleString()} ft</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Speed</span>
                <span class="tele-value">${ac.gs} kts</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Heading</span>
                <span class="tele-value">
                  <span style="display:inline-block; transform:rotate(${ac.track}deg);">▲</span>
                  <span>${ac.track}°</span>
                </span>
              </div>
              <div class="telemetry-item" style="grid-column: span 2;">
                <span class="tele-label">Vertical Rate</span>
                <span class="tele-value">${vrateHtml}</span>
              </div>
            </div>
          </div>
        `;
        elements.grid.appendChild(card);
      });
    }

    function updateCardPhoto(hex, photo) {
      const el = document.getElementById(`photo-${hex}`);
      if (el && photo) {
        el.innerHTML = `
          <img src="${photo.thumbnail}" alt="${hex}">
          <div class="photo-attribution">© ${photo.photographer}</div>
        `;
      }
    }

    elements.radiusRange.addEventListener('input', (e) => {
      state.radiusNm = Number(e.target.value);
      elements.radiusVal.textContent = state.radiusNm;
      updateMapCenter();
    });
    elements.radiusRange.addEventListener('change', fetchFeed);

    elements.sortSelect.addEventListener('change', (e) => {
      state.sortBy = e.target.value;
      render();
    });

    elements.latInput.addEventListener('change', () => {
      state.userLat = parseFloat(elements.latInput.value) || 0;
      syncInputs();
      fetchFeed();
    });

    elements.lonInput.addEventListener('change', () => {
      state.userLon = parseFloat(elements.lonInput.value) || 0;
      syncInputs();
      fetchFeed();
    });

    elements.btnGps.addEventListener('click', tryGps);
    elements.btnScanNow.addEventListener('click', fetchFeed);

    // Boot
    initMap();
    syncInputs();
    fetchFeed();
    tryGps();
    setInterval(fetchFeed, state.pollIntervalMs);
  </script>
</body>
</html>
