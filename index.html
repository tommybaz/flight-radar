<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Overhead Radar HUD</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Tactical Dark Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-space: #070a10;
      --bg-panel: rgba(13, 19, 32, 0.95);
      --bg-card: #0d1422;
      --border-hud: rgba(0, 240, 255, 0.25);
      --border-hud-bright: rgba(0, 240, 255, 0.7);
      
      --cyan-neon: #00f0ff;
      --amber-neon: #ffaa00;
      --green-radar: #00ff88;
      --red-alert: #ff3366;
      --text-main: #d8e5f7;
      --text-muted: #72849e;
      
      --font-hud: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 75%),
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      font-family: var(--font-hud);
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    /* Avionics Header */
    header.hud-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hud);
      padding: 0.65rem 1rem;
    }

    .hud-top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .radar-sweep-icon {
      width: 20px; height: 20px;
      border: 2px solid var(--cyan-neon);
      border-radius: 50%;
      position: relative;
    }
    .radar-sweep-icon::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; width: 50%; height: 2px;
      background: var(--cyan-neon);
      transform-origin: 0 0;
      animation: sweep 2s linear infinite;
    }
    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .brand h1 { font-size: 1.05rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }

    .hud-status-strip {
      display: flex; align-items: center; gap: 0.8rem;
      font-family: var(--font-mono); font-size: 0.72rem;
    }
    .stat-item { display: flex; align-items: center; gap: 0.35rem; }
    .stat-label { color: var(--text-muted); }
    .stat-value { color: var(--cyan-neon); font-weight: 700; }

    .heartbeat-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green-radar); box-shadow: 0 0 8px var(--green-radar);
      transition: transform 0.2s;
    }
    .heartbeat-dot.pulsing { transform: scale(1.6); background: #fff; }

    /* Controls ribbon */
    .controls-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem;
      margin-top: 0.5rem; padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-family: var(--font-mono); font-size: 0.78rem;
    }
    .control-group { display: flex; align-items: center; gap: 0.35rem; }

    input[type="number"], select {
      background: rgba(4, 7, 12, 0.9); border: 1px solid var(--border-hud);
      color: #fff; padding: 0.25rem 0.45rem; font-family: var(--font-mono);
      font-size: 16px; border-radius: 3px;
    }
    @media (min-width: 768px) { input[type="number"], select { font-size: 0.78rem; } }

    input[type="range"] { accent-color: var(--cyan-neon); cursor: pointer; width: 80px; }

    .btn {
      background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border-hud);
      color: var(--cyan-neon); padding: 0.35rem 0.65rem; font-family: var(--font-hud);
      text-transform: uppercase; font-size: 0.72rem; font-weight: 600;
      border-radius: 3px; cursor: pointer;
    }
    .btn:active { background: var(--cyan-neon); color: #000; }

    /* Tactical Radar Map Container */
    #mapContainer {
      width: 100%;
      height: 280px;
      position: relative;
      border-bottom: 1px solid var(--border-hud);
      background: #05080e;
    }
    @media (min-width: 900px) {
      #mapContainer { height: 360px; }
    }
    #map { width: 100%; height: 100%; }

    /* Custom Leaflet Radar Plane Marker */
    .plane-marker-icon {
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.4s ease-out;
    }
    .plane-marker-icon svg {
      width: 26px; height: 26px;
      fill: var(--cyan-neon);
      filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.7));
    }
    .plane-marker-icon.active svg {
      fill: var(--amber-neon);
      filter: drop-shadow(0 0 8px rgba(255, 170, 0, 0.9));
    }

    /* Radar sweep circle pulse */
    .user-pos-pulse {
      width: 14px; height: 14px; background: var(--cyan-neon);
      border-radius: 50%; box-shadow: 0 0 10px var(--cyan-neon);
      animation: pulseUser 2s infinite ease-out;
    }
    @keyframes pulseUser {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Aircraft Cards Layout */
    main { max-width: 1440px; margin: 1rem auto; padding: 0 0.8rem; }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .aircraft-card {
      background: var(--bg-card);
      border: 1px solid var(--border-hud);
      border-radius: 4px; overflow: hidden;
      display: flex; flex-direction: column;
      position: relative; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .aircraft-card.highlighted {
      border-color: var(--amber-neon);
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
    }

    .card-photo-wrapper {
      position: relative; height: 125px; background: #03060c;
      display: flex; align-items: center; justify-content: center;
    }
    .card-photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .silhouette-fallback {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #0e172a 0%, #060911 100%);
    }
    .silhouette-fallback svg { width: 44px; height: 44px; fill: var(--border-hud); }

    .photo-attribution {
      position: absolute; bottom: 3px; right: 5px; font-size: 0.55rem;
      font-family: var(--font-mono); background: rgba(0, 0, 0, 0.75);
      padding: 1px 4px; border-radius: 2px; color: #aaa;
    }

    .card-main { padding: 0.85rem; display: flex; flex-direction: column; gap: 0.6rem; flex: 1; }
    
    .flight-identity {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 0.35rem;
    }
    .callsign { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .icao-hex {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber-neon);
      background: rgba(255, 170, 0, 0.12); padding: 0.1rem 0.35rem; border-radius: 2px;
    }

    /* Route ribbon */
    .route-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.15);
      padding: 0.35rem 0.5rem; border-radius: 3px; font-family: var(--font-mono);
    }
    .airport-code { font-weight: 700; font-size: 0.95rem; color: #fff; }
    .route-arrow { color: var(--cyan-neon); font-size: 0.85rem; margin: 0 0.4rem; }
    .flight-duration { font-size: 0.7rem; color: var(--text-muted); }

    .aircraft-type-desc {
      font-size: 0.76rem; color: var(--text-muted); font-family: var(--font-mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .telemetry-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem 0.75rem; background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.04); padding: 0.5rem;
      border-radius: 4px; font-family: var(--font-mono);
    }
    .telemetry-item { display: flex; flex-direction: column; }
    .tele-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
    .tele-value { font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.3rem; }

    .vrate-climb { color: var(--green-radar); }
    .vrate-descend { color: var(--red-alert); }
    .vrate-level { color: var(--text-muted); }

    .empty-hud {
      grid-column: 1 / -1; text-align: center; padding: 3rem 1rem;
      border: 1px dashed var(--border-hud); border-radius: 4px; color: var(--text-muted);
    }
    .empty-hud h2 { color: #fff; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .empty-hud p { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="hud-header">
    <div class="hud-top-bar">
      <div class="brand">
        <div class="radar-sweep-icon"></div>
        <h1>AeroHUD Live</h1>
      </div>

      <div class="hud-status-strip">
        <div class="stat-item">
          <span class="stat-label">Feed:</span>
          <div id="heartbeatDot" class="heartbeat-dot"></div>
        </div>
        <div class="stat-item">
          <span class="stat-label">Planes:</span>
          <span id="statCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">POS:</span>
          <span id="statCoords" class="stat-value">--°, --°</span>
        </div>
      </div>
    </div>

    <div class="controls-strip">
      <div class="control-group">
        <label for="latInput">LAT:</label>
        <input type="number" id="latInput" step="0.001" style="width: 78px;" value="52.922">
        <label for="lonInput">LON:</label>
        <input type="number" id="lonInput" step="0.001" style="width: 78px;" value="-1.477">
        <button id="btnGps" class="btn">GPS</button>
      </div>

      <div class="control-group">
        <label for="radiusRange">Rad: <span id="radiusVal">60</span> NM</label>
        <input type="range" id="radiusRange" min="20" max="250" step="10" value="60">
      </div>

      <div class="control-group">
        <label for="sortSelect">Sort:</label>
        <select id="sortSelect">
          <option value="distance">Proximity (Closest)</option>
          <option value="altitude_asc">Altitude (Low)</option>
          <option value="altitude_desc">Altitude (High)</option>
          <option value="speed">Speed</option>
        </select>
      </div>

      <div class="control-group">
        <button id="btnScanNow" class="btn">Scan Now</button>
      </div>
    </div>
  </header>

  <!-- Live Tactical Radar Map -->
  <div id="mapContainer">
    <div id="map"></div>
  </div>

  <!-- Cards Grid -->
  <main>
    <div id="aircraftGrid" class="grid-container">
      <div class="empty-hud">
        <h2>SCANNING AIRSPACE...</h2>
        <p>Connecting to flight radar stream via Cloudflare Worker.</p>
      </div>
    </div>
  </main>

  <script>
    const WORKER_URL = "https://light-proxy.tommybaz.workers.dev";

    const state = {
      userLat: 52.9225,
      userLon: -1.4746,
      radiusNm: 60,
      sortBy: 'distance',
      pollIntervalMs: 6000,
      aircraftMap: new Map(),
      photoCache: new Map(),
      map: null,
      planeMarkers: new Map(),
      userMarker: null,
      coverageCircle: null
    };

    const elements = {
      latInput: document.getElementById('latInput'),
      lonInput: document.getElementById('lonInput'),
      btnGps: document.getElementById('btnGps'),
      radiusRange: document.getElementById('radiusRange'),
      radiusVal: document.getElementById('radiusVal'),
      sortSelect: document.getElementById('sortSelect'),
      btnScanNow: document.getElementById('btnScanNow'),
      statCount: document.getElementById('statCount'),
      statCoords: document.getElementById('statCoords'),
      heartbeatDot: document.getElementById('heartbeatDot'),
      grid: document.getElementById('aircraftGrid')
    };

    const SILHOUETTE_SVG = `
      <div class="silhouette-fallback">
        <svg viewBox="0 0 24 24">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
    `;

    // Initialize Map with dark tiles
    function initMap() {
      state.map = L.map('map', {
        center: [state.userLat, state.userLon],
        zoom: 8,
        zoomControl: false,
        attributionControl: false
      });

      // CartoDB Dark Matter tile layer
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 14,
        subdomains: 'abcd'
      }).addTo(state.map);

      updateMapCenter();
    }

    function updateMapCenter() {
      if (!state.map) return;
      state.map.setView([state.userLat, state.userLon], state.map.getZoom());

      // User location marker
      if (state.userMarker) state.userMarker.remove();
      const userIcon = L.divIcon({
        className: 'user-pos-pulse',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      state.userMarker = L.marker([state.userLat, state.userLon], { icon: userIcon }).addTo(state.map);

      // Radius coverage circle
      if (state.coverageCircle) state.coverageCircle.remove();
      const radiusMeters = state.radiusNm * 1852;
      state.coverageCircle = L.circle([state.userLat, state.userLon], {
        radius: radiusMeters,
        color: '#00f0ff',
        weight: 1,
        dashArray: '4, 6',
        fillColor: '#00f0ff',
        fillOpacity: 0.03
      }).addTo(state.map);
    }

    // Proximity, Bearing, and Direction helper
    function calculateBearingAndDistance(lat1, lon1, lat2, lon2) {
      const R = 3440.065; // Nautical miles
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distance = R * c;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      let θ = Math.atan2(y, x) * 180 / Math.PI;
      const bearing = (θ + 360) % 360;

      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const compass = directions[Math.round(bearing / 22.5) % 16];

      return { distance, bearing: Math.round(bearing), compass };
    }

    function syncInputs() {
      elements.latInput.value = state.userLat.toFixed(3);
      elements.lonInput.value = state.userLon.toFixed(3);
      elements.statCoords.textContent = `${state.userLat.toFixed(2)}°, ${state.userLon.toFixed(2)}°`;
      updateMapCenter();
    }

    function tryGps() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.userLat = pos.coords.latitude;
            state.userLon = pos.coords.longitude;
            syncInputs();
            fetchFeed();
          },
          () => {
            syncInputs();
            fetchFeed();
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        syncInputs();
        fetchFeed();
      }
    }

    async function fetchPhoto(hex) {
      if (state.photoCache.has(hex)) return state.photoCache.get(hex);
      try {
        const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
        if (res.ok) {
          const data = await res.json();
          if (data.photos && data.photos.length > 0) {
            const p = data.photos[0];
            const info = {
              thumbnail: p.thumbnail_large?.src || p.thumbnail?.src,
              photographer: p.photographer
            };
            state.photoCache.set(hex, info);
            return info;
          }
        }
      } catch (e) {}
      state.photoCache.set(hex, null);
      return null;
    }

    async function fetchFeed() {
      elements.heartbeatDot.classList.add('pulsing');
      setTimeout(() => elements.heartbeatDot.classList.remove('pulsing'), 300);

      const lat = state.userLat.toFixed(4);
      const lon = state.userLon.toFixed(4);
      const rad = state.radiusNm;

      try {
        const res = await fetch(`${WORKER_URL}?lat=${lat}&lon=${lon}&rad=${rad}`);
        if (!res.ok) return;
        const data = await res.json();
        const list = data.ac || [];
        processAircraft(list);
      } catch (err) {}
    }

    function processAircraft(list) {
      state.aircraftMap.clear();

      list.forEach(ac => {
        const hex = (ac.hex || '').trim().toLowerCase();
        if (!hex || ac.lat === undefined || ac.lon === undefined) return;

        const rel = calculateBearingAndDistance(state.userLat, state.userLon, ac.lat, ac.lon);
        if (rel.distance > state.radiusNm) return;

        state.aircraftMap.set(hex, {
          hex,
          flight: ac.flight || 'NO CALLSIGN',
          type: ac.t || 'Commercial / GA',
          alt_baro: ac.alt_baro || 0,
          gs: ac.gs || 0,
          track: ac.track || 0,
          baro_rate: ac.baro_rate || 0,
          origin: ac.origin,
          dest: ac.dest,
          lat: ac.lat,
          lon: ac.lon,
          distance: rel.distance,
          bearing: rel.bearing,
          compass: rel.compass
        });

        if (!state.photoCache.has(hex)) {
          fetchPhoto(hex).then(photo => {
            if (photo) updateCardPhoto(hex, photo);
          });
        }
      });

      render();
      syncMapMarkers();
    }

    function syncMapMarkers() {
      if (!state.map) return;

      const activeHexes = new Set();

      state.aircraftMap.forEach(ac => {
        activeHexes.add(ac.hex);

        let marker = state.planeMarkers.get(ac.hex);
        const iconHtml = `
          <div class="plane-marker-icon" id="marker-${ac.hex}" style="transform: rotate(${ac.track}deg);">
            <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
          </div>
        `;

        const divIcon = L.divIcon({
          className: '',
          html: iconHtml,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        if (marker) {
          marker.setLatLng([ac.lat, ac.lon]);
          marker.setIcon(divIcon);
        } else {
          marker = L.marker([ac.lat, ac.lon], { icon: divIcon }).addTo(state.map);
          marker.on('click', () => {
            highlightCard(ac.hex);
          });
          state.planeMarkers.set(ac.hex, marker);
        }
      });

      // Remove stale markers
      state.planeMarkers.forEach((marker, hex) => {
        if (!activeHexes.has(hex)) {
          marker.remove();
          state.planeMarkers.delete(hex);
        }
      });
    }

    function highlightCard(hex) {
      document.querySelectorAll('.aircraft-card').forEach(c => c.classList.remove('highlighted'));
      const card = document.getElementById(`ac-${hex}`);
      if (card) {
        card.classList.add('highlighted');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function render() {
      elements.statCount.textContent = state.aircraftMap.size;
      const list = Array.from(state.aircraftMap.values());

      list.sort((a, b) => {
        if (state.sortBy === 'distance') return a.distance - b.distance;
        if (state.sortBy === 'altitude_asc') return a.alt_baro - b.alt_baro;
        if (state.sortBy === 'altitude_desc') return b.alt_baro - a.alt_baro;
        if (state.sortBy === 'speed') return b.gs - a.gs;
        return 0;
      });

      if (list.length === 0) {
        elements.grid.innerHTML = `
          <div class="empty-hud">
            <h2>NO AIRCRAFT IN SECTOR</h2>
            <p>Scanning ${state.radiusNm} NM around ${state.userLat.toFixed(2)}°, ${state.userLon.toFixed(2)}°.</p>
          </div>
        `;
        return;
      }

      elements.grid.innerHTML = '';
      list.forEach(ac => {
        const card = document.createElement('div');
        card.className = 'aircraft-card';
        card.id = `ac-${ac.hex}`;

        card.addEventListener('click', () => {
          if (state.map) {
            state.map.setView([ac.lat, ac.lon], 9, { animate: true });
            highlightCard(ac.hex);
          }
        });

        const photo = state.photoCache.get(ac.hex);
        const photoHtml = photo 
          ? `<img src="${photo.thumbnail}" alt="${ac.hex}"><div class="photo-attribution">© ${photo.photographer}</div>`
          : SILHOUETTE_SVG;

        const vrateHtml = ac.baro_rate > 64 
          ? `<span class="vrate-climb">▲ +${ac.baro_rate} fpm</span>` 
          : (ac.baro_rate < -64 ? `<span class="vrate-descend">▼ ${ac.baro_rate} fpm</span>` : `<span class="vrate-level">LEVEL</span>`);

        const routeHtml = (ac.origin || ac.dest) ? `
          <div class="route-row">
            <div>
              <span class="airport-code">${ac.origin || '---'}</span>
              <span class="route-arrow">✈</span>
              <span class="airport-code">${ac.dest || '---'}</span>
            </div>
            <span class="flight-duration">TRACKED LIVE</span>
          </div>
        ` : `
          <div class="route-row">
            <span style="color:var(--text-muted); font-size:0.75rem;">LOCAL / EN-ROUTE AIRSPACE</span>
          </div>
        `;

        card.innerHTML = `
          <div class="card-photo-wrapper" id="photo-${ac.hex}">${photoHtml}</div>
          <div class="card-main">
            <div class="flight-identity">
              <span class="callsign">${ac.flight}</span>
              <span class="icao-hex">${ac.hex.toUpperCase()}</span>
            </div>
            ${routeHtml}
            <div class="aircraft-type-desc">${ac.type}</div>
            <div class="telemetry-grid">
              <div class="telemetry-item">
                <span class="tele-label">Distance & Pos</span>
                <span class="tele-value">${ac.distance.toFixed(1)} NM • ${ac.compass}</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Altitude</span>
                <span class="tele-value">${ac.alt_baro.toLocaleString()} ft</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Speed</span>
                <span class="tele-value">${ac.gs} kts</span>
              </div>
              <div class="telemetry-item">
                <span class="tele-label">Heading</span>
                <span class="tele-value">
                  <span style="display:inline-block; transform:rotate(${ac.track}deg);">▲</span>
                  <span>${ac.track}°</span>
                </span>
              </div>
              <div class="telemetry-item" style="grid-column: span 2;">
                <span class="tele-label">Vertical Rate</span>
                <span class="tele-value">${vrateHtml}</span>
              </div>
            </div>
          </div>
        `;
        elements.grid.appendChild(card);
      });
    }

    function updateCardPhoto(hex, photo) {
      const el = document.getElementById(`photo-${hex}`);
      if (el && photo) {
        el.innerHTML = `
          <img src="${photo.thumbnail}" alt="${hex}">
          <div class="photo-attribution">© ${photo.photographer}</div>
        `;
      }
    }

    elements.radiusRange.addEventListener('input', (e) => {
      state.radiusNm = Number(e.target.value);
      elements.radiusVal.textContent = state.radiusNm;
      updateMapCenter();
    });
    elements.radiusRange.addEventListener('change', fetchFeed);

    elements.sortSelect.addEventListener('change', (e) => {
      state.sortBy = e.target.value;
      render();
    });

    elements.latInput.addEventListener('change', () => {
      state.userLat = parseFloat(elements.latInput.value) || 0;
      syncInputs();
      fetchFeed();
    });

    elements.lonInput.addEventListener('change', () => {
      state.userLon = parseFloat(elements.lonInput.value) || 0;
      syncInputs();
      fetchFeed();
    });

    elements.btnGps.addEventListener('click', tryGps);
    elements.btnScanNow.addEventListener('click', fetchFeed);

    // Boot
    initMap();
    syncInputs();
    fetchFeed();
    tryGps();
    setInterval(fetchFeed, state.pollIntervalMs);
  </script>
</body>
</html>
